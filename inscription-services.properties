# Configuration de la base de données PostgreSQL (utilisant Docker)
spring.datasource.url=jdbc:postgresql://localhost:9001/inscription-service
spring.datasource.username=nnr
spring.datasource.password=nnr@
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration pour Eureka (découverte des services)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Actuator : exposition de tous les endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#serveur du port tomcat au demarrage
server.port=1503
